[project]
name = "frcsim"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "fastapi", "uvicorn", "opencv-python-headless", "rapidocr-onnxruntime", "yt-dlp[default]"]
[project.optional-dependencies]
dev = ["pytest"]
[tool.setuptools]
packages = ["frcsim", "frcsim.ingest", "frcsim.ingest.video", "frcsim.rules"]
[tool.setuptools.package-data]
frcsim = ["static/*"]
